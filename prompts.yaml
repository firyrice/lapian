  ]

  本段视频时长约 {chunk_duration} 秒，所有时间戳不得超过该值。

# 全片编导构思 Prompt（所有分镜分析合并后的统筹环节，纯文本调用、不带视频）
# 可用变量：{shots_brief} 全片分镜清单（编号 / 起止时间 / 口播 / 每镜编导构思摘要 / 画面摘要）
concept: |
  你是知识类视频的编导统筹。下面是一支知识类视频的全片分镜清单（含每镜口播、编导构思摘要、画面摘要），由逐段拉片分析合并而来。请倒推**全片级**的编导构思，供复刻团队统一执行口径——分镜级的取舍已在各镜构思里，你只管全片一致性的东西。

  【分镜清单】
  {shots_brief}

  【输出字段】
  1. `一句话立意`：全片核心论点与讲述姿态（借谁的故事、讲一个什么判断、用什么口吻）
  2. `章节结构`：数组，按叙事任务把全片分镜划成若干章，每章一个对象 {章节名, 覆盖分镜（如 "1-2"）, 叙事任务, 情绪基调}。章节必须连续覆盖全部分镜，不重叠、不遗漏
  3. `节奏设计`：全片快慢松紧的曲线说明——哪里密（信息堆叠/快切）、哪里放（呼吸点/混剪）、高光点落在哪几个分镜、为什么这样排
  4. `素材要求`（复刻时选素材的统一约束，子字段缺一不可）：
     - `国家`：画面素材的地域归属——街道、招牌、人物面孔、货币、手机 UI 语言等必须是哪国的；若全片无此类素材也要写明"无实拍素材约束"
     - `年代`：素材的年代感与事件时间范围（哪几年的事；画面质感要不要年代滤镜/做旧）
     - `素材类型`：本片用到哪几类素材通道（实拍空镜/新闻截图/财报截图/梗图/生成插画/真人出镜…），各自承担什么角色，大致配比
     - `素材风格`：影调质感要求（纪实感/广告感/生活流/舞台感/鬼畜搞怪…），能否混用、混用的边界在哪
  5. `MG画风`（下游用代码绘制 MG 层的统一风格规格，子字段缺一不可）：
     - `职能与密度`：MG 在本片承担什么——补全口播因节奏来不及展开的信息（术语全称、数据、多分支逻辑）/ 梳理抽象概念 / 纯过渡装饰；密度（密/疏）与题材的关系（数据对比流程多的题材可密，叙事抒情历史类应疏，大量用实拍承载）；克制原则（实拍已讲清的不叠 MG 图解；屏上文字必须是口播里没有的信息增量——如补"AGI · 通用人工智能"全称，而不是把台词做成文字砸屏）
     - `配色`：底色 / 主文字色 / 强调色 / 辅助色的搭配规则与明暗基调（例："纯黑网格底 + 白字 + 品牌绿点缀，强调色一次只用一个"）
     - `字体`：主标题 / 副标题 / 主数字 / 注脚各自的字体气质与字号层级（用占画面高度的百分比表述）
     - `动画样式`：全片反复出现的动效母题清单（如浮入回弹/数字滚动/打字机/嗖声转场），注明各自的使用场景与克制原则（什么情况下不许用）
     - `版式与底纹`：背景处理（纯色/网格/渐变/实拍垫底）、主力器型（哪几种构图器型为主）、留白与边距习惯

  【输出格式】
  只输出一个 JSON 对象，不要输出任何其他内容，不要用 markdown 代码块包裹：
  {
    "一句话立意": "...",
    "章节结构": [{"章节名": "...", "覆盖分镜": "...", "叙事任务": "...", "情绪基调": "..."}],
    "节奏设计": "...",
    "素材要求": {"国家": "...", "年代": "...", "素材类型": "...", "素材风格": "..."},
    "MG画风": {"职能与密度": "...", "配色": "...", "字体": "...", "动画样式": "...", "版式与底纹": "..."}
  }
